name: Linux build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: create a release with this tag (e.g. v2.0.dev7-linux1) from the selected branch'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qt5-qmake qtbase5-dev-tools libqt5opengl5-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: |
          mkdir _build
          cd _build
          qmake ../NifSkope.pro CONFIG+=release

      - name: Build
        run: make -C _build -j"$(nproc)"

      - name: Package
        id: pkg
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            label="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            label="$GITHUB_REF_NAME"
          else
            label="$(echo "$GITHUB_REF_NAME" | tr '/' '-')-${GITHUB_SHA::7}"
          fi
          name="NifSkope-${label}-linux-x86_64"
          mv _build/release "$name"
          tar czf "$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.tar.gz

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          FILE: ${{ steps.pkg.outputs.name }}.tar.gz
        run: |
          notes="Linux x86_64 build (Ubuntu 24.04, Qt 5.15) from ${GITHUB_SHA::7}.

          Requires Qt 5.15 runtime libraries, e.g. on Ubuntu/Debian:
          \`sudo apt install libqt5opengl5 libqt5xml5 libqt5network5\`

          Extract and run \`./NifSkope\` from the extracted folder."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "NifSkope $TAG (Linux)" --notes "$notes"
          fi
          gh release upload "$TAG" "$FILE" --clobber
